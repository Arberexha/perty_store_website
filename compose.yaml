services:
  database:
    image: postgres:17
    environment:
      POSTGRES_DB: perty_print
      POSTGRES_USER: perty
      POSTGRES_PASSWORD: "${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perty -d perty_print"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
